<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title %}{{ page.title }} — {% endif %}{{ site.title }}</title>
<meta name="description" content="{{ page.description | default: page.summary | default: site.description }}">
<link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
</head>
<body>
<header>
  <a class="home" href="{{ '/' | relative_url }}">{{ site.title }}</a>
  <a class="nav" href="{{ '/glossary' | relative_url }}">Glossary</a>
</header>

<main>
  {% if page.title %}<h1>{{ page.title }}</h1>{% endif %}
  {% if page.summary %}<p class="lead">{{ page.summary }}</p>{% endif %}
  {{ content }}
</main>

<footer>
  <a href="https://github.com/paulmorrishill/ProgrammingGuidance">Source on GitHub</a>
</footer>

<script id="site-config" type="application/json">{"baseurl": {{ site.baseurl | default: "" | jsonify }}}</script>
<script id="glossary-data" type="application/json">{{ site.data.glossary | jsonify }}</script>
<div id="term-tip" role="tooltip" hidden></div>
<script type="module" src="{{ '/assets/site.js' | relative_url }}"></script>
</body>
</html>
